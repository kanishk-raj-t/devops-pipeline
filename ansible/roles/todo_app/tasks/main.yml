---
  - name: Install Python runtime and pip
    ansible.builtin.apt:
      name:
        - python3
        - python3-pip
        - python3-venv
      state: present
      update_cache: yes
  
  - name: Create application directory
    ansible.builtin.file:
      path: "{{ app_dir }}"
      state: directory
      mode: "0755"
  
  - name: Copy built artifact to target host
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../todo-api-build.tar.gz"
      dest: "{{ app_dir }}/todo-api-build.tar.gz"
      mode: "0644"
    notify: Restart todo-api service
  
  - name: Extract built artifact
    ansible.builtin.unarchive:
      src: "{{ app_dir }}/todo-api-build.tar.gz"
      dest: "{{ app_dir }}"
      remote_src: yes
    notify: Restart todo-api service
  
  - name: Install Python dependencies
    ansible.builtin.pip:
      requirements: "{{ app_dir }}/requirements.txt"
      executable: pip3
  
  - name: Configure todo-api service wrapper
    ansible.builtin.copy:
      dest: /usr/local/bin/todo-api-service
      mode: "0755"
      content: |
        #!/bin/bash
        case "$1" in
          start)
            nohup env PORT={{ app_port }} python3 {{ app_dir }}/app.py > /var/log/todo-api.log 2>&1 &
            echo $! > /var/run/todo-api.pid
            ;;
          stop)
            if [ -f /var/run/todo-api.pid ]; then
              kill $(cat /var/run/todo-api.pid) 2>/dev/null || true
              rm -f /var/run/todo-api.pid
            fi
            ;;
          restart)
            $0 stop
            sleep 1
            $0 start
            ;;
        esac
    notify: Restart todo-api service
  
  - name: Ensure todo-api service is running
    ansible.builtin.shell: |
      if [ ! -f /var/run/todo-api.pid ] || ! kill -0 $(cat /var/run/todo-api.pid) 2>/dev/null; then
        /usr/local/bin/todo-api-service start
      fi